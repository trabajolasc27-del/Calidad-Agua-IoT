<div class="card">
  <span class="param-name">{{ measurement.parameter.nombre }}</span>

  <wq-gauge
    [valor]="measurement.value"
    [unidad]="measurement.parameter.unidad"
    [minimo]="measurement.parameter.minimo_fisico ?? 0"
    [maximo]="measurement.parameter.maximo_fisico ?? 100"
    [criticoBajo]="measurement.threshold?.critico_bajo ?? null"
    [alertaBajo]="measurement.threshold?.alerta_bajo ?? null"
    [alertaAlto]="measurement.threshold?.alerta_alto ?? null"
    [criticoAlto]="measurement.threshold?.critico_alto ?? null"
    [resultado]="measurement.evaluation_result"
  />
</div>
