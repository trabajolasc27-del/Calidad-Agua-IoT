<wq-page-header title="Mapa" subtitle="Ubicaciones registradas y sus dispositivos." />

<div class="map-container" #mapEl></div>

@switch (state()) {
  @case ('loading') {
    <div class="state-panel">
      <mat-spinner diameter="32" />
    </div>
  }
  @case ('error') {
    <wq-empty-state icon="error_outline" tone="error" [message]="errorMessage() ?? 'Error al cargar el mapa.'">
      <button mat-stroked-button (click)="load()">Reintentar</button>
    </wq-empty-state>
  }
  @case ('empty') {
    <wq-empty-state icon="location_off" message="Todavía no hay ubicaciones registradas." />
  }
  @case ('data') {
    <ul class="locations-list">
      @for (loc of locations(); track loc.id) {
        <li class="wq-card">
          <span class="loc-name">{{ loc.nombre }}</span>
          <span class="loc-count">{{ deviceCount(loc) }} dispositivo(s)</span>
        </li>
      }
    </ul>
  }
}
