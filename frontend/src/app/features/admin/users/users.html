<div class="users-page">
  <div class="users-header">
    <h2>Usuarios</h2>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon aria-hidden="true">person_add</mat-icon>
      Nuevo usuario
    </button>
  </div>

  @switch (state()) {
    @case ('loading') {
      <div class="state-panel">
        <mat-spinner diameter="32" />
      </div>
    }
    @case ('error') {
      <wq-empty-state icon="error_outline" tone="error" [message]="errorMessage() ?? 'Error al cargar los usuarios.'">
        <button mat-stroked-button (click)="load()">Reintentar</button>
      </wq-empty-state>
    }
    @case ('empty') {
      <wq-empty-state icon="group_off" message="Todavía no hay usuarios registrados." />
    }
    @case ('data') {
      <table mat-table [dataSource]="users()" class="users-table">
        <ng-container matColumnDef="full_name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let u">{{ u.nombre_completo || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Correo</th>
          <td mat-cell *matCellDef="let u">{{ u.correo || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let u">
            <mat-chip>{{ roleLabel(u.rol) }}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="is_active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let u">
            <wq-status-badge [tone]="u.is_active ? 'ok' : 'neutral'" [label]="u.is_active ? 'Activo' : 'Inactivo'" [icon]="u.is_active ? 'check_circle' : 'pause_circle'" />
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let u">
            <button mat-button (click)="openEditDialog(u)">Editar</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    }
  }
</div>
