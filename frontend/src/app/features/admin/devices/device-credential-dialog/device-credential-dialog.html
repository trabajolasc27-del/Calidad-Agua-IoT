<h2 mat-dialog-title>Credencial de {{ data.deviceCode }}</h2>

<mat-dialog-content class="content">
  <p class="warning">
    <mat-icon aria-hidden="true">warning</mat-icon>
    Este secreto solo se muestra una vez. Cópialo ahora y ponlo en <code>secrets.h</code> del firmware. Si lo
    pierdes, tendrás que emitir uno nuevo (eso invalida este).
  </p>

  <div class="secret-box">
    <code>{{ data.secret }}</code>
  </div>

  <button mat-stroked-button (click)="copy()">
    <mat-icon aria-hidden="true">content_copy</mat-icon>
    {{ copied() ? 'Copiado' : 'Copiar' }}
  </button>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" mat-dialog-close="true">Ya lo guardé</button>
</mat-dialog-actions>
