<mat-toolbar color="primary">
  <a mat-button routerLink="/panel">← Panel</a>
  <span>Administración</span>
</mat-toolbar>

<nav class="admin-tabs">
  @for (tab of tabs; track tab.label) {
    @if (tab.path) {
      <a class="admin-tab" [routerLink]="tab.path" routerLinkActive="active">{{ tab.label }}</a>
    } @else {
      <span class="admin-tab disabled" title="Próximamente">{{ tab.label }}</span>
    }
  }
</nav>

<main class="admin-content">
  <router-outlet />
</main>
