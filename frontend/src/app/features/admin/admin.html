<wq-page-header title="Administración" subtitle="Usuarios, dispositivos, ubicaciones, parámetros y umbrales." />

<nav class="admin-tabs">
  @for (tab of tabs; track tab.label) {
    @if (tab.path) {
      <a class="admin-tab" [routerLink]="tab.path" routerLinkActive="active">
        <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
        {{ tab.label }}
      </a>
    } @else {
      <span class="admin-tab disabled" title="Próximamente">
        <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
        {{ tab.label }}
      </span>
    }
  }
</nav>

<main class="admin-content">
  <router-outlet />
</main>
